shadow = true;
shadow-radius = 30;
shadow-opacity = 0.75;
shadow-offset-x = -30;
shadow-offset-y = -30;
shadow-color = "#000000"

fading = true;
fade-in-step = 0.5;
fade-out-step = 1;
fade-delta = 10;

corner-radius = 6;

backend = "glx";
vsync = true;


unredir-if-possible = false;
detect-client-opacity = true;
use-damage = true;

blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = true;
  kern = "3x3box";
}

rules: (

  # Fullscreen — no corners
  {
    match = "fullscreen";
    corner-radius = 0;
  },

  # Dock (e.g. polybar)
  {
    match = "window_type = 'dock'";
    corner-radius = 0;
    fade = true;
  },

  # Polybar
  {
    match = "class_g = 'Polybar'";
    blur-background = true;
    shadow = true;
  },

  # dmenu — no corners
  {
    match = "class_g = 'dmenu'";
    corner-radius = 0;
  },

  # Menus/popups — no corners, no blur, no shadow
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu' || window_type = 'utility'";
    corner-radius = 0;
    blur-background = false;
    shadow = false;
  },

  {
    match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
    shadow = false;
    blur-background = false;
  },

  #Per app opacity

  {
    match = "class_g = 'Alacritty'";
    opacity = 0.73;
  },

  {
    match = "class_g = 'firefox'";
    opacity = 1;
  },

  {
    match = "class_g = 'discord'";
    opacity = 0.90;
  },

  {
    match = "class_g = 'Spotify'";
    opacity = 0.90;
  },

  {
    match = "class_g = 'Thunar'";
    opacity = 0.80;
  },

  {
    match = "class_g = 'code-oss' || class_g = 'code' || class_g = 'code-insiders'";
    opacity = 0.80;
  },

  {
    match = "class_g = 'Antigravity' || class_g = 'antigravity'";
    opacity = 0.80;
  },


  {
    match = "class_g = 'Navigator'";
    opacity = 0.80;
  },


  {
    match = "class_g = 'Rofi'";
    opacity = 0.80;
  },

  # ── Animations ────────────────────────────────────────────────────────────

  @include "animations/close/overshootless.conf"
  @include "animations/open/overshootless.conf"
  @include "animations/geometry/overshootless.conf"

  @include "animations/tag/slidefade/overshoot/tag-left-to-right.conf"

)
